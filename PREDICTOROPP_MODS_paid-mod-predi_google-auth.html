<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1d4ed8"/>
<title>PREDICTOROPP MODS — AI Prediction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb;--card:#ffffff;--ink:#0b1530;--muted:#6b7493;
  --pri:#1d4ed8;--pri2:#3b82f6;--pri-soft:#eaf1ff;
  --ok:#16a34a;--err:#dc2626;--warn:#f59e0b;--violet:#7c3aed;
  --line:#e6ecf5;--shadow:0 10px 30px -12px rgba(20,40,90,.18);
  --grad:linear-gradient(135deg,#2563eb 0%,#3b82f6 60%,#60a5fa 100%);
  --grad-dark:linear-gradient(135deg,#0b1530 0%,#1e3a8a 100%);
  --boss-grad:linear-gradient(135deg,#1d4ed8 0%,#7c3aed 50%,#2563eb 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;overscroll-behavior-y:none}
body{min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:90px;overflow-x:hidden}
button{font-family:inherit;border:0;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--pri);text-decoration:none}

/* PREDICTOROPP MODS BANNER */
.boss-banner{background:var(--boss-grad);padding:10px 16px 8px;text-align:center;position:relative;overflow:hidden}
.boss-banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:bossshine 2.5s linear infinite}
@keyframes bossshine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.boss-title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;color:#fff;letter-spacing:4px;
  text-transform:uppercase;animation:bosspulse 3s ease-in-out infinite;
  text-shadow:0 0 20px rgba(255,255,255,.5),0 0 40px rgba(96,165,250,.4);position:relative;z-index:1}
@keyframes bosspulse{0%,100%{text-shadow:0 0 20px rgba(255,255,255,.5),0 0 40px rgba(96,165,250,.4);letter-spacing:4px}50%{text-shadow:0 0 30px rgba(255,255,255,.9),0 0 60px rgba(124,58,237,.7);letter-spacing:5px}}
.boss-sub{font-size:10px;color:rgba(255,255,255,.75);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:2px;position:relative;z-index:1}
.powered-bar{background:rgba(11,21,48,.08);padding:5px 16px;text-align:center;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.powered-bar span{color:var(--pri);font-family:'Orbitron',sans-serif;font-size:10px}

/* UTILITY */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(37,99,235,.6);transition:transform .15s ease,box-shadow .2s ease;width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.dark{background:#0b1530;color:#fff;box-shadow:none}
.btn.sm{padding:10px 14px;font-size:13px;width:auto;border-radius:10px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#fbfcfe;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(59,130,246,.12);background:#fff}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.g-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;color:#1f2937;border:1px solid #dadce0;border-radius:14px;padding:13px 18px;font-weight:600;font-size:14.5px;box-shadow:0 2px 6px rgba(20,40,90,.06);transition:all .2s ease;position:relative;overflow:hidden}
.g-btn:hover{box-shadow:0 8px 22px -8px rgba(59,130,246,.45);border-color:#a5c5ff;transform:translateY(-1px)}
.g-btn:active{transform:scale(.98)}
.g-btn svg{width:20px;height:20px;flex-shrink:0}
.ripple{position:absolute;border-radius:50%;background:rgba(59,130,246,.25);transform:scale(0);animation:ripple .6s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.muted{color:var(--muted)}.hide{display:none!important}.center{text-align:center}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri)}
.badge.ok{background:#dcfce7;color:#15803d}.badge.warn{background:#fef3c7;color:#b45309}.badge.err{background:#fee2e2;color:#b91c1c}
.page{animation:fade .35s ease both;padding:18px 16px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* AUTH */
.auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 60% at 50% 0%,#dbe9ff 0%,#f4f7fb 60%,#f4f7fb 100%)}
.auth .card{width:100%;padding:26px 22px}
.auth-boss{background:var(--boss-grad);border-radius:18px 18px 0 0;padding:22px;text-align:center;margin:-26px -22px 20px;position:relative;overflow:hidden}
.auth-boss::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:bossshine 2s linear infinite}
.auth-boss .bt{font-family:'Orbitron',sans-serif;font-weight:900;font-size:26px;color:#fff;letter-spacing:5px;animation:bosspulse 3s ease-in-out infinite;position:relative;z-index:1;text-shadow:0 0 20px rgba(255,255,255,.6)}
.auth-boss .bs{font-size:11px;color:rgba(255,255,255,.8);font-weight:700;letter-spacing:2px;position:relative;z-index:1;margin-top:3px}
.switch{display:flex;background:#eef2f9;padding:4px;border-radius:12px;margin-bottom:18px}
.switch button{flex:1;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.switch button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.06)}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--boss-grad);color:#fff;display:grid;place-items:center;font-size:11px;font-family:'Orbitron',sans-serif;font-weight:900}
.topbar .brand-name{font-family:'Orbitron',sans-serif;font-weight:900;font-size:14px;background:var(--boss-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px}
.icon-btn{width:36px;height:36px;border-radius:10px;background:#f1f5fb;display:grid;place-items:center}

/* NOTICE */
.notice{background:var(--grad);color:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;overflow:hidden;position:relative;box-shadow:0 14px 30px -16px rgba(37,99,235,.7);margin-bottom:16px}
.notice::before{content:"";position:absolute;inset:-2px;border-radius:18px;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:shine 4s linear infinite;mix-blend-mode:overlay}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.notice .dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.25);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.7}}
.notice .marquee{flex:1;white-space:nowrap;overflow:hidden}
.notice .marquee span{display:inline-block;padding-left:100%;animation:scrollx 22s linear infinite}
@keyframes scrollx{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.notice .tag{background:rgba(255,255,255,.18);padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.5px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}
.section-title h3{margin:0;font-size:16px;font-family:'Space Grotesk'}
.section-title .link{font-size:12px;color:var(--pri);font-weight:600}

/* GAMES */
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s;animation:float 6s ease-in-out infinite}
.game:nth-child(2n){animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.game:active{transform:scale(.97)}
.game .thumb{aspect-ratio:1.4;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:'Space Grotesk';font-weight:800;font-size:22px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:inset 0 -20px 40px rgba(0,0,0,.25)}
.game .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px}
.game .thumb .lbl{position:relative;z-index:2}
.game .thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.4),transparent 50%)}
.game .name{font-weight:700;font-size:14px}
.game .desc{font-size:11px;color:var(--muted);margin-top:2px}
.game .lock{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:4px 8px;border-radius:999px;font-weight:700;backdrop-filter:blur(4px);display:flex;align-items:center;gap:4px}
.game .lock.ok{background:rgba(22,163,74,.85)}

/* PROOFS */
.proofs{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.proofs::-webkit-scrollbar{display:none}
.proof{flex:0 0 78%;background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;scroll-snap-align:start}
.proof .img{aspect-ratio:1.4;background:var(--grad-dark);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;font-family:'Space Grotesk';position:relative;overflow:hidden}
.proof .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.proof .img .lbl{position:relative;z-index:2}
.proof .cap{padding:10px 12px;font-size:12px;color:var(--muted)}

/* BOTTOM NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:40}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;padding:4px 10px;border-radius:10px}
.nav button.on{color:var(--pri)}
.nav button.on .ico{background:var(--pri-soft)}
.nav .ico{width:38px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px}

/* PAYMENT */
.qr{aspect-ratio:1;width:200px;margin:8px auto 12px;border-radius:18px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:10px}
.qr img,.qr canvas{width:100%;height:100%}
.upi-row{display:flex;align-items:center;justify-content:space-between;background:#f6f8fc;padding:12px 14px;border-radius:12px;margin-top:10px;font-weight:600}
.trust{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.trust .t{flex:1;min-width:130px;background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;display:flex;align-items:center;gap:8px}
.trust .t .b{width:28px;height:28px;border-radius:8px;background:var(--pri-soft);display:grid;place-items:center;color:var(--pri)}

/* PREDICTION */
.pred-head{background:var(--grad-dark);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
.pred-head::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 100% 0%,rgba(96,165,250,.35),transparent 60%)}
.pred-head .top{display:flex;align-items:center;gap:12px;position:relative}
.pred-head .glogo{width:52px;height:52px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:800;box-shadow:0 8px 18px -6px rgba(0,0,0,.5)}
.pred-head h2{margin:0;font-size:18px;font-family:'Space Grotesk'}
.pred-head .live{display:inline-flex;align-items:center;gap:6px;background:rgba(34,197,94,.15);color:#86efac;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;margin-top:4px}
.pred-head .live .ldot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 1.4s infinite}
.pred-head .meta{display:flex;gap:10px;margin-top:14px;position:relative}
.pred-head .meta .box{flex:1;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.12)}
.pred-head .meta .lbl{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.pred-head .meta .val{font-family:'Space Grotesk';font-weight:700;font-size:18px;margin-top:2px}
.timer-tabs{display:flex;background:#eef2f9;border-radius:12px;padding:4px;margin-bottom:14px;width:100%;box-sizing:border-box}
.timer-tabs button{flex:1;min-width:0;padding:10px 4px;font-weight:700;color:var(--muted);border-radius:9px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.timer-tabs button.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px -6px rgba(37,99,235,.6)}
.predict-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:20px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.predict-card .ai{font-size:11px;font-weight:700;color:var(--pri);letter-spacing:1px;font-family:'Orbitron',sans-serif}
.predict-card .num-wrap{display:flex;justify-content:center;align-items:center;gap:18px;margin:16px 0}
.ball{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:800;font-size:30px;color:#fff;box-shadow:0 12px 24px -10px rgba(0,0,0,.4);position:relative;animation:pop .4s ease both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ball.green{background:radial-gradient(circle at 30% 30%,#34d399,#059669)}
.ball.red{background:radial-gradient(circle at 30% 30%,#f87171,#dc2626)}
.ball.violet{background:radial-gradient(circle at 30% 30%,#a78bfa,#7c3aed)}
.ball.mix{background:conic-gradient(#dc2626 0 50%,#7c3aed 50% 100%)}
.ball.mix.g{background:conic-gradient(#059669 0 50%,#7c3aed 50% 100%)}
.ball::after{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 55%);pointer-events:none}
.chips{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.5px;box-shadow:0 6px 14px -6px rgba(0,0,0,.25);animation:pop .4s .1s both}
.chip.big{background:#fef3c7;color:#b45309}.chip.small{background:#dbeafe;color:#1d4ed8}
.chip.green{background:#dcfce7;color:#15803d}.chip.red{background:#fee2e2;color:#b91c1c}.chip.violet{background:#ede9fe;color:#6d28d9}
.predict-btn{background:var(--boss-grad);color:#fff;border-radius:14px;padding:14px;font-weight:800;width:100%;font-size:15px;box-shadow:0 14px 30px -10px rgba(37,99,235,.6);letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Orbitron',sans-serif}
.predict-btn:disabled{opacity:.7}
.history{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.history .h-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.history .h-head h4{margin:0;font-size:14px;font-family:'Space Grotesk'}
.history table{width:100%;border-collapse:collapse;font-size:12px}
.history th{text-align:left;padding:10px 14px;color:var(--muted);font-weight:600;background:#fafbfd;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.history td{padding:10px 14px;border-top:1px solid var(--line)}
.tag-win{background:#dcfce7;color:#15803d;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.tag-loss{background:#fee2e2;color:#b91c1c;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}
.tag-pending{background:#fef3c7;color:#b45309;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}

/* PROFILE */
.profile-head{background:var(--grad-dark);color:#fff;border-radius:20px;padding:22px;text-align:center;position:relative;overflow:hidden;margin-bottom:14px}
.avatar{width:80px;height:80px;border-radius:50%;background:var(--boss-grad);margin:0 auto 10px;display:grid;place-items:center;font-size:30px;font-family:'Space Grotesk';font-weight:800;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.list-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .l{display:flex;align-items:center;gap:12px}
.list-row .l .ico{width:34px;height:34px;border-radius:10px;background:var(--pri-soft);display:grid;place-items:center;color:var(--pri)}
.copyright-bar{background:#fff;border-top:1px solid var(--line);padding:12px 16px;text-align:center;font-size:11px;color:var(--muted);font-weight:600;margin-top:8px;border-radius:12px}
.copyright-bar .boss-text{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;background:var(--boss-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* TOAST */
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
.toast{background:#0b1530;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);font-size:13px;font-weight:600;animation:slidein .3s ease both;display:flex;align-items:center;gap:10px}
.toast.ok{background:#15803d}.toast.err{background:#b91c1c}.toast.warn{background:#b45309}
@keyframes slidein{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;background:rgba(11,21,48,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px;animation:slideup .3s ease both;max-height:90vh;overflow-y:auto}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-family:'Space Grotesk';font-size:20px}
.sheet .ok-icon{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:#15803d;display:grid;place-items:center;margin:0 auto 12px;font-size:30px;animation:pop .4s ease both}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;background:currentColor;border-radius:50%;animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.page-boss-header{background:var(--boss-grad);border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:relative;overflow:hidden}
.page-boss-header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:bossshine 2.5s linear infinite}
.page-boss-header .pt{font-family:'Orbitron',sans-serif;font-weight:900;font-size:13px;color:#fff;letter-spacing:2px;text-transform:uppercase;position:relative;z-index:1}
.page-boss-header .pb{font-size:10px;color:rgba(255,255,255,.75);font-weight:600;position:relative;z-index:1}
/* Loader overlay */

/* ===== Firestore helpers ===== */
async function fsGet(path) {
  try {
    const snap = await getDoc(doc(db, ...path.split('/')));
    return snap.exists() ? { id: snap.id, ...snap.data() } : null;
  } catch(e) { return null; }
}
async function fsSet(path, data) {
  try { await setDoc(doc(db, ...path.split('/')), data, { merge: true }); return true; }
  catch(e) { console.error('fsSet', e); return false; }
}
async function fsAdd(col, data) {
  try { const r = await addDoc(collection(db, col), data); return r.id; }
  catch(e) { console.error('fsAdd', e); return null; }
}
async function fsUpdate(path, data) {
  try { await updateDoc(doc(db, ...path.split('/')), data); return true; }
  catch(e) { return false; }
}
async function fsQuery(col, ...constraints) {
  try {
    const snap = await getDocs(query(collection(db, col), ...constraints));
    return snap.docs.map(d=>({id:d.id,...d.data()}));
  } catch(e) { return []; }
}

function bindAuth(){
  $$('.switch button').forEach(b=>b.onclick=()=>{
    $$('.switch button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const t=b.dataset.tab;
    $('#loginForm').classList.toggle('hide',t!=='login');
    $('#registerForm').classList.toggle('hide',t!=='register');
  });

  // Email Login
  $('#li_btn').onclick=async()=>{
    const email=$('#li_email').value.trim(),pw=$('#li_pw').value;
    if(!email||!pw)return toast('Enter email & password','err');
    const btn=$('#li_btn');
    btn.innerHTML='<span class="spinner"></span> Signing in…';btn.disabled=true;
    try{
      await signInWithEmailAndPassword(auth,email,pw);
      // onAuthStateChanged will handle the rest
    }catch(e){
      btn.innerHTML='Login to PREDICTOROPP MODS';btn.disabled=false;
      toast(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'?'Wrong email or password':e.code==='auth/user-not-found'?'No account found':e.code==='auth/invalid-email'?'Invalid email':e.message,'err');
    }
  };

  // Register
  $('#rg_btn').onclick=async()=>{
    const name=$('#rg_name').value.trim(),email=$('#rg_email').value.trim(),
          phone=$('#rg_phone').value.trim(),pw=$('#rg_pw').value,pw2=$('#rg_pw2').value;
    if(!name||!email||!phone||!pw)return toast('All fields required','err');
    if(pw.length<6)return toast('Password min 6 chars','err');
    if(pw!==pw2)return toast('Passwords do not match','err');
    const btn=$('#rg_btn');
    btn.innerHTML='<span class="spinner"></span> Creating account…';btn.disabled=true;
    try{
      const cred=await createUserWithEmailAndPassword(auth,email,pw);
      await updateProfile(cred.user,{displayName:name});
      await fsSet(`users/${cred.user.uid}`,{
        uid:cred.user.uid,name,email,phone,provider:'email',
        approved:false,blocked:false,createdAt:Date.now()
      });
      toast('Welcome to PREDICTOROPP MODS!','ok');
      // onAuthStateChanged will handle navigation
    }catch(e){
      btn.innerHTML='Join PREDICTOROPP MODS';btn.disabled=false;

            await signInWithRedirect(auth,gProv);
            return;

          throw popupErr;
        }
        if(u){
          const existing=await fsGet(`users/${u.uid}`);
          await fsSet(`users/${u.uid}`,{
            uid:u.uid,name:u.displayName||'Google User',email:u.email,

        }
      }catch(e){
        btn.innerHTML=origHTML;btn.disabled=false;

const DIRECT_API_30S = 'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json';

// CORS proxy list — tried in order until one works
const CORS_PROXIES = [
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
  'https://cors-anywhere.herokuapp.com/',
];

let PRED_MODE = (function(){ try{ const s=localStorage.getItem('bm_pred_mode'); return (s==='30S'||s==='1M')?s:'1M'; }catch(e){ return '1M'; } })(); // persisted

function PERIOD_SECONDS(){ return PRED_MODE === '30S' ? 30 : 60; }

// Build a proxied URL using given proxy base
function proxiedUrl(proxy, targetUrl){
  if(proxy.endsWith('=')) return proxy + encodeURIComponent(targetUrl);
  return proxy + targetUrl;
}

// Fetch history via direct call first, then try each proxy on CORS failure
async function fetchWithCORSFallback(url, signal){
  // Try direct first
  try{
    const r = await fetch(url + '?t=' + Date.now(), {
      method: 'GET',
      headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' },
      cache: 'no-store',
      signal
    });
    if(r.ok) return await r.json();
  } catch(e){
    if(e.name === 'AbortError') throw e; // Don't swallow timeout
    console.warn('[PREDICTOROPP MODS] Direct fetch failed, trying proxies:', e.message);
  }

  // Try each proxy in sequence
  for(const proxy of CORS_PROXIES){
    try{
      const pUrl = proxiedUrl(proxy, url + '?t=' + Date.now());
      const r = await fetch(pUrl, {
        method: 'GET',
        headers: { 'Cache-Control': 'no-cache' },
        cache: 'no-store',
        signal
      });
      if(r.ok){
        const data = await r.json();
        console.log('[PREDICTOROPP MODS] Proxy success:', proxy);
        return data;
      }
    } catch(e){
      if(e.name === 'AbortError') throw e;
      console.warn('[PREDICTOROPP MODS] Proxy failed:', proxy, e.message);
    }
  }
  throw new Error('All CORS proxies failed — check network');
}

    timerEl.textContent = `00:${String(secLeft).padStart(2,'0')}`;

  normalizePeriod(value){

      for(const item of payload){
        const found = this.extractIssueNumber(item, depth + 1);
        if(found) return found;
      }
      return null;
    }
    if(typeof payload !== 'object') return null;

    const directKeys = [
      'issueNumber','issue','IssueNumber','issueNo','issueNum','currentIssue','currentIssueNumber',
      'gameIssue','period','periodNumber','periodNum','turnNum','expect'
    ];

  /* ===== PREDICTOROPP MODS — REAL-TIME AI ANALYSIS ENGINE v5 =====
     Fully deterministic multi-layer probabilistic engine.
     - No Math.random, no cached predictions, no session memory.
     - Every prediction is recomputed fresh from latest live API history.
     - Same history => same output => stable across sessions/devices/time.
     - Multi-layer: recency-weighted frequency, order-1 & order-2 Markov,
       streak/run analysis, parity/size momentum, volatility, anti-drift
       balancing, multi-layer confirmation, confidence scoring. */

    _ai: {
      COLOR_MAP: {0:'RED+VIOLET',1:'GREEN',2:'RED',3:'GREEN',4:'RED',5:'GREEN+VIOLET',6:'RED',7:'GREEN',8:'RED',9:'GREEN'},

      // Layer 1 — Recency-weighted frequency (exponential decay, newest = highest weight)
      layerFrequency(nums){
        const w = Array(10).fill(0);
        const decay = 0.88;
        let weight = 1;
        for(let i = 0; i < nums.length; i++){
          w[nums[i]] += weight;
          weight *= decay;
        }
        const total = w.reduce((a,b)=>a+b,0) || 1;
        // Anti-drift: cold-number regression — invert frequency into probability
        const probs = w.map(v => 1 - (v/total));
        const s = probs.reduce((a,b)=>a+b,0) || 1;
        return probs.map(p => p/s);
      },

      // Layer 2 — Order-1 Markov transitions from the last observed number
      layerMarkov1(nums){
        const last = nums[0];
        const probs = Array(10).fill(0.05); // smoothing prior
        for(let i = 0; i < nums.length - 1; i++){
          // nums[0] is newest, so transition nums[i+1] -> nums[i]
          if(nums[i+1] === last) probs[nums[i]] += 1;
        }
        const s = probs.reduce((a,b)=>a+b,0);
        return probs.map(p => p/s);
      },

      // Layer 3 — Order-2 Markov (last two numbers as context)
      layerMarkov2(nums){
        if(nums.length < 3){
          const flat = Array(10).fill(0.1);
          return flat;
        }
        const a = nums[1], b = nums[0];
        const probs = Array(10).fill(0.03);
        for(let i = 0; i < nums.length - 2; i++){
          if(nums[i+2] === a && nums[i+1] === b) probs[nums[i]] += 1;
        }
        const s = probs.reduce((a,b)=>a+b,0);
        return probs.map(p => p/s);
      },

      // Layer 4 — Size/parity streak reversal pressure
      layerStreak(nums){
        const probs = Array(10).fill(0.1);
        // Current size streak
        const sizeOf = n => n >= 5 ? 1 : 0;
        let runSize = 1;
        for(let i = 1; i < nums.length; i++){
          if(sizeOf(nums[i]) === sizeOf(nums[0])) runSize++; else break;
        }
        // Current color streak (red vs green; ignore 0/5 violet for run length)
        const colorOf = n => (n===0||n===5) ? -1 : (n%2===0 ? 0 : 1); // 0=red, 1=green
        const c0 = colorOf(nums[0]);
        let runColor = 1;
        if(c0 !== -1){
          for(let i = 1; i < nums.length; i++){
            const c = colorOf(nums[i]);
            if(c === c0) runColor++; else break;
          }
        }
        // Reversal pressure increases with run length (cap at 6)
        const sizePressure = Math.min(runSize, 6) / 6;      // 0..1
        const colorPressure = Math.min(runColor, 6) / 6;    // 0..1
        const targetSize = sizeOf(nums[0]) === 1 ? 0 : 1;   // opposite
        const targetColor = c0 === 1 ? 0 : (c0 === 0 ? 1 : -1);
        for(let n = 0; n <= 9; n++){
          let p = 0.1;
          if(sizeOf(n) === targetSize) p += 0.6 * sizePressure;
          if(targetColor !== -1 && colorOf(n) === targetColor) p += 0.5 * colorPressure;
          // Violet numbers slightly downweighted unless streak is extreme
          if((n === 0 || n === 5) && runColor < 5) p *= 0.55;
          probs[n] = p;
        }
        const s = probs.reduce((a,b)=>a+b,0);
        return probs.map(p => p/s);
      },

      // Layer 5 — Volatility / stability detector (smooths predictions when noisy)
      volatility(nums){
        const mean = nums.reduce((a,b)=>a+b,0) / nums.length;
        const variance = nums.reduce((a,b)=>a+(b-mean)*(b-mean),0) / nums.length;
        const std = Math.sqrt(variance);
        // WinGo std on uniform 0..9 ≈ 2.87. Normalize 0..1
        return Math.min(1, std / 2.87);
      },

      // Adaptive weighted fusion of all layers (fixed weights => deterministic, no drift)
      fuse(layers, vol){
        // Higher volatility => lean on frequency regression; lower => trust Markov & streak
        const stability = 1 - vol;
        const W = {
          freq:    0.22 + 0.18 * vol,
          mk1:     0.26 + 0.10 * stability,
          mk2:     0.18 + 0.12 * stability,
          streak:  0.20 + 0.10 * stability,
          balance: 0.14
        };
        // Balance layer = uniform prior to prevent over-commitment
        const balance = Array(10).fill(0.1);
        const out = Array(10).fill(0);
        for(let n = 0; n < 10; n++){
          out[n] =
            W.freq    * layers.freq[n]   +
            W.mk1     * layers.mk1[n]    +
            W.mk2     * layers.mk2[n]    +
            W.streak  * layers.streak[n] +
            W.balance * balance[n];
        }
        const s = out.reduce((a,b)=>a+b,0) || 1;
        return out.map(p => p/s);
      },

      // Risk filter — penalise the just-occurred number and adjacent repeats
      riskFilter(probs, nums){
        const out = probs.slice();
        out[nums[0]] *= 0.55;
        if(nums[1] === nums[0]) out[nums[0]] *= 0.7; // double-repeat penalty
        const s = out.reduce((a,b)=>a+b,0) || 1;
        return out.map(p => p/s);
      },

      pickBest(probs){
        let bestN = 0, bestP = -1;
        for(let n = 0; n < 10; n++){
          if(probs[n] > bestP){ bestP = probs[n]; bestN = n; }
        }
        return { num: bestN, prob: bestP };
      },

      sizeProbs(probs){
        let big = 0, small = 0;
        for(let n = 0; n < 10; n++){ if(n >= 5) big += probs[n]; else small += probs[n]; }
        return { big, small };
      },

      colorProbs(probs){
        let red = 0, green = 0, violet = 0;
        for(let n = 0; n < 10; n++){
          if(n === 0){ red += probs[n]*0.5; violet += probs[n]*0.5; }
          else if(n === 5){ green += probs[n]*0.5; violet += probs[n]*0.5; }
          else if(n % 2 === 0) red += probs[n];
          else green += probs[n];
        }
        return { red, green, violet };
      }
    },

    async buildPrediction(){
      const recent = State.history.slice(0, 20)
        .map(item => ({ period: item.period, result: Number(item.result) }))
        .filter(h => Number.isFinite(h.result) && h.result >= 0 && h.result <= 9);
      if(recent.length < 5) return null;

      const ai = this._ai;
      const nums = recent.map(h => h.result); // index 0 = newest

      // Multi-layer analysis
      const layers = {
        freq:   ai.layerFrequency(nums),
        mk1:    ai.layerMarkov1(nums),
        mk2:    ai.layerMarkov2(nums),
        streak: ai.layerStreak(nums)
      };
      const vol = ai.volatility(nums);
      let fused = ai.fuse(layers, vol);
      fused = ai.riskFilter(fused, nums);

      const pick = ai.pickBest(fused);
      const sz = ai.sizeProbs(fused);
      const col = ai.colorProbs(fused);

      // Multi-layer confirmation: how strongly do layers agree on top pick?
      const agreement = (
        (ai.pickBest(layers.freq).num   === pick.num ? 1 : 0) +
        (ai.pickBest(layers.mk1).num    === pick.num ? 1 : 0) +
        (ai.pickBest(layers.mk2).num    === pick.num ? 1 : 0) +
        (ai.pickBest(layers.streak).num === pick.num ? 1 : 0)
      ); // 0..4

      // Confidence = blended top-prob, dominance margin, layer agreement, stability
      const sorted = fused.slice().sort((a,b)=>b-a);
      const margin = sorted[0] - sorted[1];
      const stability = 1 - vol;
      const rawConf =
        0.40 * (pick.prob * 10) +          // 0..1 (top number probability scaled)
        0.20 * (margin * 10) +              // 0..1 dominance
        0.20 * (agreement / 4) +            // 0..1 layer agreement
        0.20 * stability;                   // 0..1 market stability
      const conf = Math.round(72 + Math.max(0, Math.min(1, rawConf)) * 22); // 72..94

      // Size prediction follows aggregate probability mass, not just top number
      const bs = sz.big >= sz.small ? 'BIG' : 'SMALL';
      // Color prediction follows aggregate color mass (more stable than per-number)
      let color;
      const maxColor = Math.max(col.red, col.green);
      const dominantBase = col.red >= col.green ? 'RED' : 'GREEN';
      // Only suggest violet when violet mass is materially elevated AND top pick is 0/5
      if(col.violet > 0.18 && (pick.num === 0 || pick.num === 5)){
        color = dominantBase + '+VIOLET';
      } else {
        color = dominantBase;
      }
      // If top number itself is 0/5, respect canonical color map
      if(pick.num === 0) color = 'RED+VIOLET';
      if(pick.num === 5) color = 'GREEN+VIOLET';

      // Trend direction (size momentum over last 8)
      const recentSize = nums.slice(0, 8);
      const bigRatio = recentSize.filter(n => n >= 5).length / recentSize.length;
      const trend = bigRatio > 0.6 ? 'BIG MOMENTUM'
                  : bigRatio < 0.4 ? 'SMALL MOMENTUM'
                  : 'BALANCED';

      const risk = conf >= 86 ? 'LOW'
                 : conf >= 78 ? 'MEDIUM'
                 : 'ELEVATED';
      const stabilityLabel = stability > 0.65 ? 'HIGH'
                           : stability > 0.4  ? 'MODERATE'
                           : 'VOLATILE';

      return {
        num: pick.num,
        bs,
        color,
        confidence: conf,
        analysis: {
          confidence: conf,
          trend,
          stability: stabilityLabel,
          stabilityPct: Math.round(stability * 100),
          risk,
          agreement,
          volatility: Math.round(vol * 100),
          bigPct: Math.round(sz.big * 100),
          smallPct: Math.round(sz.small * 100),
          redPct: Math.round(col.red * 100),
          greenPct: Math.round(col.green * 100),
          violetPct: Math.round(col.violet * 100),
          mode: PRED_MODE
        },
        reason: `⚡ Multi-layer AI • ${agreement}/4 layers aligned • ${trend} • stability ${stabilityLabel} • confidence ${conf}%`
      };
    },

   start(){
     this.stop();
     this.currentPeriod = null;
     this.lastProcessedPeriod = null;
     this.lastPredictionPeriod = null;
     this.liveSynced = false;
     State.predicting = false;

     const periodEl = $('#periodVal');
     if(periodEl) periodEl.textContent = 'SYNCING…';
     this.setSyncStatus('Waiting for live period sync…');
     renderPredResult(null, 'Waiting for live period sync…');
     renderHistory();
     this.updateTimer();
     this.updatePredictButton();

     this.fetchCurrentPeriod(true);
     this.fetchHistory(true);
     this.timerInt = setInterval(() => this.updateTimer(), 250);
     this.apiInt = setInterval(() => this.fetchCurrentPeriod(), PERIOD_POLL_MS);
     this.historyInt = setInterval(() => this.fetchHistory(), 15000);

     if(!this._hooksBound){
       this._hooksBound = true;
       window.addEventListener('focus', () => this.fetchCurrentPeriod(true));
       document.addEventListener('visibilitychange', () => {
         if(document.visibilityState === 'visible') this.fetchCurrentPeriod(true);
       });
     }
   },

   stop(){
     clearInterval(this.timerInt);
     clearInterval(this.apiInt);
     clearInterval(this.historyInt);
     clearTimeout(this.retryTimer);
     this.timerInt = null;
     this.apiInt = null;
     this.historyInt = null;
     this.retryTimer = null;
     this._fetchingCurrent = false;
     this._fetchingHistory = false;
   },

   async predict(){
     if(!this.liveSynced || !this.currentPeriod){
       toast('Waiting for live period sync…', 'warn');
       return;
     }
     if(!State.history.length){
       toast('Loading real history first…', 'warn');
       this.fetchHistory(true);
       return;
     }
     if(this.lastPredictionPeriod === this.currentPeriod){
       toast('This live period is already processed.', 'warn');
       return;
     }
     if(State.predicting) return;

     State.predicting = true;
     this.updatePredictButton();
     renderPredResult(null, '🤖 AI analyzing live history…');

     try{
       const result = await this.buildPrediction();
       if(!result){
         renderPredResult(null, 'AI prediction unavailable — tap PREDICT NEXT to retry');
         return;
       }
       renderPredResult(result, result.reason);
       this.lastPredictionPeriod = this.currentPeriod;
     } finally {
       State.predicting = false;
       this.updatePredictButton();
     }
   }
 };

function switchPredMode(mode){
  if(mode !== '1M' && mode !== '30S') return;
  if(PRED_MODE === mode) return;
  PRED_MODE = mode;
  try{ localStorage.setItem('bm_pred_mode', mode); }catch(e){}
  State.history = [];
  const b1 = document.getElementById('modeBtn1M');
  const b30 = document.getElementById('modeBtn30S');
  if(b1)  b1.classList.toggle('on', mode==='1M');
  if(b30) b30.classList.toggle('on', mode==='30S');
  PRED.start();
  toast(mode==='30S' ? '30 Second Wingo mode' : '1 Minute Wingo mode', 'ok');
}

  }
  const {num,bs,color,reason,analysis}=result;
  const chips=color.split('+').map(c=>`<div class="chip ${c.toLowerCase()}">${c}</div>`).join('');
  const a = analysis || {};
  const conf = a.confidence || 0;
  const riskColor = a.risk === 'LOW' ? '#16a34a' : a.risk === 'MEDIUM' ? '#f59e0b' : '#dc2626';
  const stabColor = a.stability === 'HIGH' ? '#16a34a' : a.stability === 'MODERATE' ? '#f59e0b' : '#dc2626';
  const trendColor = a.trend === 'BIG MOMENTUM' ? '#dc2626' : a.trend === 'SMALL MOMENTUM' ? '#2563eb' : '#7c3aed';
  const panel = analysis ? `
    <div style="margin-top:12px;padding:12px;background:linear-gradient(135deg,#0b1530,#1e3a8a);border-radius:14px;color:#fff;text-align:left">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:2px;color:#86efac">⚡ LIVE AI ANALYSIS</span>
        <span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#86efac"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 1.4s infinite;display:inline-block"></span>ACTIVE</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden">
          <div style="width:${conf}%;height:100%;background:linear-gradient(90deg,#22c55e,#3b82f6);border-radius:999px;transition:width .6s ease"></div>
        </div>
        <div style="font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;color:#fff;min-width:48px;text-align:right">${conf}%</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px">
        <div style="background:rgba(255,255,255,.06);padding:7px 9px;border-radius:9px">
          <div style="color:#94a3b8;font-size:9px;letter-spacing:1px;font-weight:700">TREND</div>
          <div style="color:${trendColor};font-weight:800;margin-top:2px">${esc(a.trend||'—')}</div>
        </div>
        <div style="background:rgba(255,255,255,.06);padding:7px 9px;border-radius:9px">
          <div style="color:#94a3b8;font-size:9px;letter-spacing:1px;font-weight:700">RISK LEVEL</div>
          <div style="color:${riskColor};font-weight:800;margin-top:2px">${esc(a.risk||'—')}</div>
        </div>
        <div style="background:rgba(255,255,255,.06);padding:7px 9px;border-radius:9px">
          <div style="color:#94a3b8;font-size:9px;letter-spacing:1px;font-weight:700">STABILITY</div>
          <div style="color:${stabColor};font-weight:800;margin-top:2px">${esc(a.stability||'—')} (${a.stabilityPct||0}%)</div>
        </div>
        <div style="background:rgba(255,255,255,.06);padding:7px 9px;border-radius:9px">
          <div style="color:#94a3b8;font-size:9px;letter-spacing:1px;font-weight:700">LAYER MATCH</div>
          <div style="color:#fff;font-weight:800;margin-top:2px">${a.agreement||0}/4 aligned</div>
        </div>
        <div style="background:rgba(255,255,255,.06);padding:7px 9px;border-radius:9px">
          <div style="color:#94a3b8;font-size:9px;letter-spacing:1px;font-weight:700">SIZE BIAS</div>
          <div style="color:#fff;font-weight:800;margin-top:2px">B ${a.bigPct||0}% • S ${a.smallPct||0}%</div>
        </div>

async function loadTx(){
  const el=$('#txList');if(!el)return;
  if(!State.fbUser||!State.fbUser.uid){
    el.innerHTML=`<div class="card muted center" style="padding:24px">Please login to view your transactions.</div>`;
    return;
  }
  el.innerHTML=`<div style="text-align:center;padding:24px;color:var(--muted)" class="dots"><i></i><i></i><i></i></div>`;
  // Hard timeout so the page never gets stuck on loading
  let done=false;
  const timeout=setTimeout(()=>{
    if(done)return;
    if(el && el.querySelector('.dots')){
      el.innerHTML=`<div class="card muted center" style="padding:24px">Taking too long to load. <button class="btn ghost sm" onclick="loadTx()" style="margin-top:8px">Retry</button></div>`;
    }
  },12000);
  try{
    const list=await fsQuery('payments',where('userId','==',State.fbUser.uid));
    list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    done=true;clearTimeout(timeout);
    el.innerHTML=list.length?list.map(p=>{
      const st=(p.status||'pending').toLowerCase();
      const tagCls=st==='approved'||st==='completed'?'tag-win':st==='rejected'||st==='failed'?'tag-loss':'tag-pending';
      const label=st==='approved'?'COMPLETED':st.toUpperCase();
      const when=p.createdAt?new Date(p.createdAt).toLocaleString():'—';
      return `<div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <b>${esc(p.game||'Premium')}</b>
          <span class="${tagCls}">${label}</span>
        </div>
        <div class="muted" style="font-size:12px">UTR: <span style="font-family:monospace">${esc(p.utr||'—')}</span></div>
        <div class="muted" style="font-size:12px">${when}</div>
        ${p.amount?`<div class="muted" style="font-size:12px">Amount: ₹${esc(String(p.amount))}</div>`:''}
        ${p.img?`<img src="${p.img}" style="margin-top:10px;border-radius:10px;max-width:100%;max-height:160px;object-fit:cover">`:''}
      </div>`;}).join('')
    : `<div class="card muted center" style="padding:24px">No transactions yet</div>`;
  }catch(e){
    done=true;clearTimeout(timeout);
    console.error('loadTx error:',e);
    el.innerHTML=`<div class="card muted center" style="padding:24px">Could not load transactions. <button class="btn ghost sm" onclick="loadTx()" style="margin-top:8px">Retry</button></div>`;
  }
}

// Helper: show/hide full-screen loader with a message
function showLoader(msg='Please wait...'){
  const l=$('#fbLoader');if(!l)return;
  $('#fbLoaderMsg').textContent=msg;
  l.style.display='flex';
}
function hideLoader(){
  const l=$('#fbLoader');if(l)l.style.display='none';
}

// INSTANT RENDER — show login page right away, no waiting for Firebase
State.settings=DEFAULTS;
renderPage();

// Then Firebase auth state resolves silently in background
let _authReady=false;
onAuthStateChanged(auth, async (fbUser) => {
  try{
    if(fbUser){
      State.fbUser=fbUser;
      let profile=await fsGet(`users/${fbUser.uid}`);
      if(!profile){
        profile={uid:fbUser.uid,name:fbUser.displayName||'User',email:fbUser.email,phone:'-',
          photo:fbUser.photoURL||'',provider:fbUser.providerData[0]?.providerId||'email',
          approved:false,blocked:false,createdAt:Date.now()};
        await fsSet(`users/${fbUser.uid}`,profile);
      }
      if(profile.blocked){
        State.user=null;State.fbUser=null;
        await signOut(auth);
        hideLoader();
        toast('Your account is blocked. Contact support.','err');
        renderPage();return;
      }
      State.user=profile;
      onSnapshot(doc(db,'users',fbUser.uid),snap=>{
        if(snap.exists()){
          State.user={...snap.data()};
          if(State.page==='home'||State.page==='profile')renderPage();
        }
      });
      // Load app data in background, render immediately with defaults
      loadAppData().then(()=>{if(State.page==='home')renderPage();});
      hideLoader();
      renderPage();
      if(State.page==='tx')setTimeout(loadTx,100);
    } else {
      State.fbUser=null;State.user=null;
      // Load app data in background (for settings, games etc on login page)
      loadAppData().catch(()=>{});
      hideLoader();
      if(_authReady)renderPage(); // Only re-render if was logged in before (logout)
    }
    _authReady=true;
  }catch(err){
    console.error('Auth error:',err);
    hideLoader();
    _authReady=true;
  }
});
